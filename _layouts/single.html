---
layout: default
---
<main id="main" class="content-shell content-shell--prose" tabindex="-1">
  <article>
    {% if page.title and page.title != '' %}
      <header class="page-heading">
        <h1>{{ page.title | escape }}</h1>
        {% if page.description %}<p>{{ page.description }}</p>{% endif %}
      </header>
    {% endif %}
    <div class="page__content">{{ content }}</div>
  </article>
</main>
