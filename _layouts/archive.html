---
layout: default
---
<main id="main" class="content-shell{% if page.prose %} content-shell--prose{% endif %}" tabindex="-1">
  <header class="page-heading">
    <p class="eyebrow">Prateek Chhikara / {{ page.title | escape }}</p>
    <h1>{{ page.title | escape }}</h1>
    {% if page.description %}<p>{{ page.description }}</p>{% endif %}
  </header>
  <div class="archive-content">{{ content }}</div>
</main>
