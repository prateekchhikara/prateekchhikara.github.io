- name: "Filip Ilievski"
  image: "/images/filip.jpeg"
  url: "https://www.linkedin.com/in/filipilievski91"
  role: "Assistant Professor (Sr.) at VU Amsterdam"
  quote: "Prateek worked with me as a research assistant for 1.5 years at USC's Information Sciences Institute, on several projects covering both interactive text-based tasks and computer vision tasks. Prateek came in already as a mature researcher, with the most solid publication history of a Master's student I've ever seen. Week by week, he was extremely respectful, hard-working, and very well-organized. His reports were always extensive with experimental results, findings, and future steps. Besides coding and discussions, he also excelled in writing - he has a clear and informative writing style, at the level of a third-year PhD student. Finally, he is a great team player, very understandable and constructive in the research process."
