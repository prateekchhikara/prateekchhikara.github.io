- title: "Bidirectional LSTM for Named Entity Recognition"
  url: "https://github.com/prateekchhikara/NER_biLSTM"
  image: "/images/ner.webp"
  details: ["Implemented a Bidirectional LSTM (BLSTM) for Named Entity Recognition (NER) using GloVe word embeddings. Initialized neural network embeddings with GloVe vectors, addressing the case-insensitivity of GloVe by adding a boolean mask for case-sensitive NER recognition.","Developed model architecture with components like Embedding, LSTM, Linear, Dropout, and ELU layers, and trained using hyperparameters such as a batch size of 64, SGD optimizer, and a learning rate of 0.5 over 50 epochs, achieving an accuracy of 98.43%."]
  tags: ["BiLSTM","GloVe","NER","PyTorch","NLP"]
  summary: "Named entity recognition with a bidirectional LSTM, GloVe embeddings, and an additional feature for capitalization."
  year: "2023"
  repository_created: "2023-12-24"
- title: "Image White Balance Correction using Variational Autoencoders"
  url: "https://github.com/prateekchhikara/white_balance_correction"
  image: "/images/white_balance.webp"
  details: ["Implemented a Variational Autoencoder Model for white balance correction in images, focusing on neutralizing color casts caused by different lighting conditions to achieve natural and accurate colors.","Utilized the Adobe White-Balanced Images Dataset, which includes 2,881 rendered images from various camera models, including mobile phones and a DSLR camera, for testing and experiments.","Developed an encoder with convolutional layers and ReLU activation, a reparameterization technique for sampling from the latent space, and a decoder with linear and transposed convolutional layers, complemented by a loss function combining reconstruction loss and Kullback-Leibler (KL) Divergence loss."]
  tags: ["VAE","Computer Vision","PyTorch","Image Processing"]
  summary: "Correcting image color casts with a variational autoencoder trained on the Adobe White-Balanced Images Dataset."
  year: "2023"
  repository_created: "2023-11-30"
- title: "Variational Autoencoders for Digit Generation"
  url: "https://github.com/prateekchhikara/deep-learning-assignment2"
  image: "/images/vae.webp"
  details: ["Developed a comprehensive project on \"Variational Autoencoders for Digit Generation,\" focusing on the implementation and analysis of Variational Auto-Encoders (VAEs) in machine learning. VAEs are renowned for their likelihood maximization and unsupervised representation learning capabilities.","Executed key tasks including setting up a PyTorch data loading pipeline, constructing an auto-encoder architecture, extending it to a VAE, tuning parameters, analyzing representations, and enhancing generative capabilities using the MNIST dataset of handwritten digits."]
  tags: ["VAE","PyTorch","MNIST","Deep Learning"]
  summary: "A PyTorch variational autoencoder for generating handwritten digits and exploring latent representations."
  year: "2023"
  repository_created: "2023-03-18"
- title: "Generative Adversarial Networks for Image Generation"
  url: "https://github.com/prateekchhikara/deep-learning-assignment2"
  image: "/images/gan.webp"
  details: ["Implemented a Generative Adversarial Network (GAN) based on \"Unsupervised Representation Learning with Deep Convolutional Generative Adversarial Networks\", utilizing the CIFAR-10 dataset for training, and developed both discriminator and generator components.","Conducted a comprehensive training process with a robust loop, loss computation, and parameter updates, accompanied by activation maximization technique for visualization.","Combined practical coding of advanced neural network architectures with theoretical analysis, resulting in a deepened understanding of GANs, all documented in the repository for reference."]
  tags: ["GAN","DCGAN","CIFAR-10","PyTorch"]
  summary: "Training and analyzing a deep convolutional GAN on CIFAR-10, including activation visualizations."
